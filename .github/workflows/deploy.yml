name: Build and Deploy to AKS

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    
    # 1. Pull down your source code onto GitHub's server
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Set up Java 17 environment to compile the code
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # 3. Build the Spring Boot executable .jar file (skipping unit tests for speed)
    - name: Build with Maven
      run: mvn clean package -DskipTests

    # 4. Connect to your Azure Account using your saved secret
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # 5. Connect to your private Azure Container Registry
    - name: Azure Container Registry Login
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
        username: ${{ secrets.AZURE_CLIENT_ID }}
        password: ${{ secrets.AZURE_CLIENT_SECRET }}

    # 6. Read the Dockerfile, manufacture the image, and upload it to ACR
    - name: Build and Push Docker Image to ACR
      run: |
        docker build -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/inventory-app:latest .
        docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/inventory-app:latest

    # 7. Connect to your AKS Kubernetes Cluster
    - name: Set AKS Context
      uses: azure/aks-set-context@v4
      with:
        resource-group: 'rg-jumbo-prod'
        cluster-name: 'aks-jumbo-cluster'

    # 8. Tell Kubernetes to read your deployment.yaml file and run the application
    - name: Deploy to Kubernetes Cluster
      uses: azure/k8s-deploy@v5
      with:
        manifests: |
          deployment.yaml
        images: |
          ${{ secrets.REGISTRY_LOGIN_SERVER }}/inventory-app:latest
